  <script>
    var num = 0;

    window.$docsify = {
      plugins: [
        // Render mermaid code blocks after every page render (not just the first)
        function (hook) {
          hook.doneEach(function () {
            var nodes = [];
            document.querySelectorAll('pre[data-lang=mermaid]').forEach(function (pre) {
              var div = document.createElement('div');
              div.className = 'mermaid';
              div.textContent = pre.textContent;
              pre.parentNode.replaceChild(div, pre);
              nodes.push(div);
            });
            if (nodes.length) mermaid.run({ nodes: nodes });
          });
        }
      ],

      name: 'Xuhao Luo',
      repo: 'Stuart0l',
      homepage: 'about.md',
      themeColor: '#0F4C81',

      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 2
    }
  </script>
